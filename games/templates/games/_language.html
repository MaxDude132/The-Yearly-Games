{% load i18n %}{% get_available_languages as languages %}{% for code, name in languages %}{% if code != LANGUAGE_CODE %}
        <form action="{% url 'set_language' %}" method="post">{% csrf_token %}
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button type="submit" class="btn" name="language" value="{{ code }}" lang="{{ code }}">{{ name }}</button>
        </form>{% endif %}{% endfor %}
